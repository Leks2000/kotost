<script>
// Совместимость по знакам: порт app/lib/astro/compat.dart (signCompat). Менять только вместе с Dart:
// тест app/test/compat_web_test.dart сверяет 144 пары с выводом этого файла (share_site/test_compat.js).
(function (root) {
  const SIGNS = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo',
    'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
  const SPHERES = ['love', 'friend', 'work', 'talk'];
  // База по расстоянию между знаками (любовь, дружба, работа, общение).
  const BASE = [
    [78, 85, 70, 88], // один знак
    [62, 68, 74, 60], // соседи
    [84, 90, 80, 92], // секстиль
    [58, 55, 66, 52], // квадрат
    [92, 88, 78, 86], // трин
    [60, 58, 64, 56], // через пять знаков
    [80, 64, 60, 70], // оппозиция
  ];

  function idx(s) {
    const i = SIGNS.indexOf(s);
    if (i < 0) throw new Error('unknown sign ' + s);
    return i;
  }

  // 0..6, как signDistance в Dart (там % всегда неотрицательный).
  function distance(a, b) {
    const d = (((idx(b) - idx(a)) % 12) + 12) % 12;
    return d > 6 ? 12 - d : d;
  }

  function compat(a, b) {
    const ia = idx(a), ib = idx(b);
    const row = BASE[distance(a, b)];
    const spheres = {};
    let sum = 0;
    for (let i = 0; i < SPHERES.length; i++) {
      const wiggle = (((ia + ib) * 7 + ia * ib + i * 5) % 9) - 4;
      const v = Math.min(97, Math.max(40, row[i] + wiggle));
      spheres[SPHERES[i]] = v;
      sum += v;
    }
    // Dart round(): от нуля на .5, для положительных то же, что Math.round.
    return { total: Math.round(sum / SPHERES.length), spheres };
  }

  // Ключ текста пары в общем кэше ИИ: cp:<знак>:<знак> по порядку зодиака.
  function pieceKey(a, b) {
    return idx(a) <= idx(b) ? 'cp:' + a + ':' + b : 'cp:' + b + ':' + a;
  }

  // Знак по дате (тропический, границы по средним датам; на стыке знаков точнее в приложении).
  const STARTS = [[3, 21], [4, 20], [5, 21], [6, 21], [7, 23], [8, 23], [9, 23], [10, 23], [11, 22], [12, 22], [1, 20], [2, 19]];
  function signOfDate(month, day) {
    for (let i = 11; i >= 0; i--) {
      const j = (i + 1) % 12;
      const [m0, d0] = STARTS[i];
      const [m1, d1] = STARTS[j];
      const after = month > m0 || (month === m0 && day >= d0);
      const before = month < m1 || (month === m1 && day < d1);
      if (m0 < m1 ? after && before : after || before) return SIGNS[i];
    }
    return SIGNS[0];
  }

  const api = { SIGNS, SPHERES, distance, compat, pieceKey, signOfDate };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KotostCompat = api;
})(this);

</script>

время давать друг другу свободу.","cp:scorpio:sagittarius":"Скорпион и Стрелец звучат как яркий дуэт тайны и вечного поиска приключений. Легко вдохновлять друг друга на новые цели, а уступка пригодится в темпе движения вперед. В любви и дружбе вам помогает интерес к неизведанному.","cp:scorpio:capricorn":"Скорпион и Козерог в любви и дружбе звучат как глубокая и преданная симфония. Вам легко ставить общие цели и двигаться к ним, а уступка понадобится в умении вовремя смягчать принципы.","cp:scorpio:aquarius":"Скорпион и Водолей в любви и дружбе звучат как союз тайны и безграничного простора. Вам легко удивлять друг друга новыми идеями, а уступка понадобится в принятии потребности каждого побыть в тишине.","cp:scorpio:pisces":"Скорпион и Рыбы в любви и дружбе звучат как нежная водная стихия полной гармонии. Вам легко понимать друг друга без лишних слов, а уступка понадобится в возвращении из мира грёз в земные дела.","cp:sagittarius:sagittarius":"Стрелец и Стрелец в любви и дружбе звучат как яркий огонь вечного приключения. Вам легко затевать совместные поездки и радоваться жизни, а уступка понадобится в умении иногда слушать чужие планы.","cp:sagittarius:capricorn":"Стрелец и Козерог в любви и дружбе звучат как встреча вдохновения и мудрого расчёта. Вам легко учиться друг у друга новому опыту, а уступка понадобится в балансе между спонтанностью и порядком.","cp:sagittarius:aquarius":"Стрелец и Водолей в любви и дружбе звучат как ветер дальних странствий и открытий. Вам легко разделять любые увлечения и мечты, а уступка понадобится в простой бытовой стабильности.","cp:sagittarius:pisces":"Стрелец и Рыбы в любви и дружбе звучат как союз поиска смысла и глубоких чувств. Вам легко делиться философскими взглядами, а уступка понадобится в решении практических задач.","cp:capricorn:capricorn":"Козерог и Козерог в любви и дружбе звучат как надёжный монолит из общих ценностей. Вам легко строить планы на долгие годы вперед, а уступка понадобится в проявлении мягких эмоций.","cp:capricorn:aquarius":"Козерог и Водолей в любви и дружбе звучат как сочетание традиций и смелых перспектив. Вам легко уважать личные границы друг друга, а уступка понадобится в согласовании темпа жизни.","cp:capricorn:pisces":"Козерог и Рыбы в любви и дружбе звучат как заботливый причал для уставшего путника. Вам легко дарить друг другу душевное тепло, а уступка понадобится в преодолении излишней замкнутости.","cp:aquarius:aquarius":"Водолей и Водолей звучат как космическая симфония свободолюбивых идей и открытий. Легко разделять необычные хобби друг друга, а уступка важна для проявления земной заботы. В любви и дружбе вам интересно создавать совместное будущее.","cp:aquarius:pisces":"Водолей и Рыбы звучат как тихий вечерний разговор о будущем и вселенной. Легко плыть по течению вдохновения, а уступка требуется в решении практических задач. В дружбе и любви вам тепло вместе мечтать.","cp:pisces:pisces":"Рыбы и Рыбы звучат как волшебная сказка, полная эмпатии и тонких чувств. Легко угадывать настроения друг друга без слов, а уступка нужна для возвращения в реальный мир. В любви и дружбе вам важно сохранять опору."},"stores":[{"label":"RuStore","url":"https://www.rustore.ru/catalog/app/com.kotost.kotost_tarot"},{"label":"Google Play","url":"https://play.google.com/store/apps/details?id=com.kotost.kotost_tarot"}],"lang":"ru","sender":"sagittarius","base":"https://leks2000.github.io/kotost","prefix":"","t":{"kicker":"Тебя позвали в шатёр","kickerHome":"Kotost · таро и гороскоп","h1":"Знак друга: {sign}","h1Home":"Совместимость по знакам","say":"Выбери свой знак, и я посчитаю, как вы сходитесь в любви, дружбе, работе и общении.","sayHome":"Выбери два знака, и я посчитаю, как они сходятся в любви, дружбе, работе и общении.","friendSign":"Знак друга","partnerSign":"Знак партнёра","yourSign":"Твой знак","choose":"Выбрать","date":"Не помнишь знак? Дата рождения:","cta":"В приложении Kotost сравнит ваши натальные карты целиком, разложит таро на двоих и каждое утро пришлёт гороскоп.","ctaAfter":"Это только знаки. В Kotost можно сравнить натальные карты целиком: видно, где вы зажигаете друг друга, а где спорите.","download":"Скачать Kotost","invite":"Позвать своих друзей","shareText":"Я {sign}. Проверь, как мы сходимся по звёздам:","copied":"Ссылка скопирована","copy":"Скопируй ссылку:","pairTitle":"{a} и {b}","foot":"Kotost · таро и гороскоп. Расчёт идёт в браузере, дата никуда не отправляется."}};
(function () {
  const C = window.KotostCompat, T = D.t, $ = (id) => document.getElementById(id);
  const VS = '︎'; // текстовый вид знака, не эмодзи
  const sign = (id) => D.signs.find((s) => s.id === id);
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  let a = D.sender, b = null, active = a ? 'B' : 'A';

  $('kicker').textContent = a ? T.kicker : T.kickerHome;
  $('h1').textContent = a ? fmt(T.h1, { sign: sign(a).name }) : T.h1Home;
  $('say').textContent = a ? T.say : T.sayHome;
  $('capA').textContent = a ? T.friendSign : T.partnerSign;
  $('capB').textContent = T.yourSign;
  $('dateLabel').textContent = T.date;
  $('ctaText').textContent = T.cta;
  $('store').textContent = T.download;
  $('store').href = D.stores[0].url;
  $('store2').textContent = D.stores[1].label;
  $('store2').href = D.stores[1].url;
  $('invite').textContent = T.invite;
  $('foot').textContent = T.foot;
  if (a) $('slotA').disabled = true;

  for (const s of D.signs) {
    const el = document.createElement('button');
    el.type = 'button';
    el.dataset.id = s.id;
    el.innerHTML = '<span class="sym">' + s.glyph + VS + '</span>' + s.name;
    el.addEventListener('click', () => choose(s.id));
    $('grid').appendChild(el);
  }
  $('slotA').addEventListener('click', () => { if (!D.sender) { active = 'A'; paint(); } });
  $('slotB').addEventListener('click', () => { active = 'B'; paint(); });
  $('date').addEventListener('change', (e) => {
    const v = e.target.value; // дата остаётся в браузере
    if (!v) return;
    const [, m, d] = v.split('-').map(Number);
    choose(C.signOfDate(m, d));
  });

  function choose(id) {
    if (active === 'A') { a = id; if (!b) active = 'B'; } else { b = id; if (!a) active = 'A'; }
    paint();
    if (a && b) render();
  }

  function slot(k, id) {
    const badge = $('badge' + k), s = id && sign(id);
    badge.className = 'badge sym' + (s ? '' : ' empty');
    badge.textContent = s ? s.glyph + VS : '+';
    $('nm' + k).textContent = s ? s.name : T.choose;
    $('slot' + k).classList.toggle('active', active === k && !(a && b && D.sender));
  }

  function paint() {
    slot('A', a);
    slot('B', b);
    const cur = active === 'A' ? a : b;
    for (const el of $('grid').children) el.classList.toggle('on', el.dataset.id === cur);
  }

  function render() {
    const r = C.compat(a, b), dist = D.dist[String(C.distance(a, b))];
    const text = D.pieces[C.pieceKey(a, b)] || dist.text;
    const box = $('result');
    box.className = '';
    box.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="who"></div><div class="total">' + r.total + '%</div><div class="title"></div><p class="text"></p>';
    card.querySelector('.who').textContent = fmt(T.pairTitle, { a: sign(a).name, b: sign(b).name });
    card.querySelector('.title').textContent = dist.title;
    card.querySelector('.text').textContent = text;
    for (const id of C.SPHERES) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.innerHTML = '<div class="row"><span></span><b>' + r.spheres[id] + '%</b></div><div class="track"><div class="fill"></div></div><div class="line"></div>';
      bar.querySelector('span').textContent = D.spheres[id];
      bar.querySelector('.line').textContent = dist[id];
      card.appendChild(bar);
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.querySelector('.fill').style.width = r.spheres[id] + '%'; }));
    }
    box.appendChild(card);
    $('invite').classList.remove('hide');
    $('ctaText').textContent = T.ctaAfter;
    try { history.replaceState(null, '', location.pathname + '?with=' + b); } catch (e) {}
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Позвать своих: ссылка на свой знак (тот, кого позвали, теперь сам зовёт).
  $('invite').addEventListener('click', async () => {
    const mine = D.sender ? b : (b || a);
    const url = D.base + D.prefix + '/c/' + mine + '/';
    const text = fmt(T.shareText, { sign: sign(mine).name });
    try {
      if (navigator.share) { await navigator.share({ text: text, url: url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast(T.copied); } catch (e) { prompt(T.copy, url); }
  });

  function toast(s) {
    const t = $('toast');
    t.textContent = s;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2000);
  }

  // ?with=<знак> (вернулись по ссылке или обновили страницу): сразу показать пару.
  const w = new URLSearchParams(location.search).get('with');
  paint();
  if (w && sign(w) && a) { active = 'B'; choose(w); }
})();
</script>
</body>
</html>
